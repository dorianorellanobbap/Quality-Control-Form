<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<meta name="robots" content="noindex">
<!-- This page only exists to keep the old URL alive.
     The app moved to the B&BAP organisation, and GitHub does not redirect
     Pages URLs after a repository transfer. Printed QR codes and saved phone
     links still point here, so this forwards them to the new home.
     Any query string or #hash is carried across. -->
<link rel="canonical" href="https://b-bap.github.io/Quality-Control-Form/">
<meta http-equiv="refresh" content="0; url=https://b-bap.github.io/Quality-Control-Form/">
<script>
  (function () {
    try {
      var base = "https://b-bap.github.io/Quality-Control-Form/";
      location.replace(base + location.search + location.hash);
    } catch (e) {
      location.href = "https://b-bap.github.io/Quality-Control-Form/";
    }
  })();
</script>
<style>
  body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 32rem;
         padding: 0 1rem; line-height: 1.5; }
  a { font-size: 1.125rem; }
</style>
</head>
<body>
  <h1>This app moved</h1>
  <p>Taking you there now. If nothing happens:</p>
  <p><a href="https://b-bap.github.io/Quality-Control-Form/">https://b-bap.github.io/Quality-Control-Form/</a></p>
</body>
</html>
